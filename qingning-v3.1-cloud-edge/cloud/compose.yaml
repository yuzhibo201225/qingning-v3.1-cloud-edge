name: pi-cafe-classroom-cloud
services:
  cafe-cloud:
    build: .
    image: pi-cafe-classroom-cloud:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "15001:8000"
    volumes:
      - ./data:/data
    mem_limit: 250m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 30s
      timeout: 4s
      retries: 3
