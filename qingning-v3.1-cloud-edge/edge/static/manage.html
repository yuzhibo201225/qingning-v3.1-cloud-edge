<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菜单管理 · 青柠食光</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="container"><header class="header"><a class="brand" href="/"><span class="brandmark">✦</span> 青柠食光 <span class="tiny no-mobile">STAFF CONSOLE</span></a><nav class="nav"><a href="/cashier" data-nav="/cashier">收银台</a><a href="/kitchen" data-nav="/kitchen">后厨</a><a href="/dashboard" data-nav="/dashboard">数据</a><a href="/manage" data-nav="/manage">菜单</a><a href="/qr" data-nav="/qr">桌码</a><a href="/" class="no-mobile">顾客端 ↗</a></nav></header><div class="page-title"><div><div class="eyebrow">MENU MANAGEMENT</div><h1>菜单与价格管理 🍱</h1><p>上传照片、添加菜品、编辑价格、上架或下架；变更自动同步到顾客页面。</p></div></div><div class="panel section-space"><div class="row manage-title"><div><div class="eyebrow">ADD / EDIT FOOD</div><h2 id="formTitle">新增菜品</h2><p class="muted">在树莓派上上传菜品照片。手机页面会在约 3 秒内自动刷新。</p></div><span class="tag">📸 本地保存 · 断网可用</span></div>
<form id="dishForm" class="dish-editor">
<div class="field"><label for="dishName">菜品名称</label><input required maxlength="40" id="dishName" placeholder="例如：宫保鸡丁"></div>
<div class="field"><label for="dishCategory">菜品分类</label><input required maxlength="24" list="categoryOptions" id="dishCategory" placeholder="热菜 / 主食 / 饮品"><datalist id="categoryOptions"></datalist></div>
<div class="field"><label for="dishPrice">售价（元）</label><input required type="number" step="0.01" min="1" max="1000" id="dishPrice" placeholder="19.90"></div>
<div class="field"><label for="dishBadge">标签（可选）</label><input maxlength="20" id="dishBadge" placeholder="招牌 / 人气"></div>
<div class="field editor-wide"><label for="dishDesc">菜品介绍</label><textarea id="dishDesc" rows="2" maxlength="100" placeholder="鲜香、口味与份量简介"></textarea></div>
<div class="field editor-wide"><label for="dishImage">菜品照片（新增菜品必选；修改时不选则保留原图）</label><input id="dishImage" type="file" accept="image/png,image/jpeg,image/webp,image/avif,image/heic,image/heif,image/*"><small class="muted">自动缩放并压缩为 WebP，最多 700 KB，不依赖图床；首次添加请选照片。</small><img id="imagePreview" class="image-preview hide" alt="菜品图片预览"></div>
<label class="toggle-check"><input type="checkbox" id="dishAvailable" checked> 立即上架</label>
<label class="toggle-check"><input type="checkbox" id="dishSpicy"> 辣味</label>
<div class="toolbar editor-wide"><button class="button" id="dishSubmit" type="submit">＋ 添加新菜品</button><button class="button secondary hide" id="cancelEdit" type="button">取消编辑</button><span class="tiny" id="editTip">新增后手机端将自动出现新菜品</span></div>
</form></div>
<div class="panel section-space"><div class="row manage-title"><div><div class="eyebrow">LIVE INVENTORY</div><h2>全部菜品与上下架</h2></div><span class="tiny" id="menuCount"></span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>图片 / 菜名</th><th>分类</th><th>售价（元）</th><th>状态</th><th>管理操作</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div class="footer">青柠食光 · MENU MANAGEMENT</div><div id="toast" class="toast"></div><script src="/static/common.js"></script><script src="/static/admin.js"></script><script src="/static/manage.js"></script></body></html>
